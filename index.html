<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diamondverse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen mobile app — top status bar, scrolling screen, bottom tab bar; battle/dialogue/creation are full-screen layers. */
:root{
  --void:#0a0c19; --panel:#131733; --panel2:#1a1f44; --line:#2a3166; --text:#e9ecff; --muted:#8e95c6;
  --facet:#7ef2ff; --gold:#ffc145; --rot:#ff4d7a; --hp:#ff5d73; --mp:#5fb3ff; --ok:#6fe3a1;
  --display:'Marcellus SC', 'Cinzel', Georgia, serif;
  --body:'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --prism:linear-gradient(120deg,#7ef2ff,#b07cff 45%,#ffc145 80%,#7ef2ff);
  color-scheme:dark;
}
[hidden]{display:none!important}
body{margin:0;background:var(--void);color:var(--text);font:15px/1.4 var(--body);
  background-image:radial-gradient(ellipse at 50% -10%,#1d2252 0,transparent 60%);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--void)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--facet);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.topbar .who{flex:1;min-width:0}
.topbar .who b{font:17px var(--display);letter-spacing:.04em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .who small{color:var(--muted)}
.cur{display:flex;align-items:center;gap:5px;font-weight:600;font-size:14px}
.gem{width:12px;height:12px;transform:rotate(45deg);border-radius:2px;flex:none}
.gem.g{background:var(--gold)} .gem.d{background:var(--prism)} .gem.s{background:#b07cff}
#screen{padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(8,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{padding:10px 0 9px;font-size:10px;font-weight:600;letter-spacing:.02em;min-width:0;overflow:hidden;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px}
.tabs button i{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid currentColor}
.tabs button.on{color:var(--facet)} .tabs button.on i{background:var(--facet)}
h2{font:22px/1.15 var(--display);margin:0;letter-spacing:.03em;text-wrap:balance}
h3{font:15px var(--display);margin:0;letter-spacing:.06em;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--facet);color:#071022;border-color:transparent}
.btn.gold{background:var(--gold);color:#1d1400;border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}
.bar{height:8px;background:#0d1028;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--facet);transition:width .35s}
.bar.hp>i{background:var(--hp)} .bar.mp>i{background:var(--mp)} .bar.xp>i{background:var(--prism)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#0d1028}
.chip.rot{color:var(--rot);border-color:#5a2140} .chip.pure{color:var(--ok);border-color:#1f5a40} .chip.lock{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.stat{background:#0d1028;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat small{display:block;font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.stat b{font-size:18px}
/* Story map */
.world{position:relative;overflow:hidden}
.world::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,var(--wh) 0,transparent 55%);opacity:.18;pointer-events:none}
.nodes{display:flex;align-items:center;gap:0;margin-top:12px}
.node{width:34px;height:34px;transform:rotate(45deg);border:2px solid var(--line);background:#0d1028;border-radius:5px;display:grid;place-items:center;flex:none}
.node span{transform:rotate(-45deg);font-weight:700;font-size:13px}
.node.open{border-color:var(--wh);box-shadow:0 0 12px -2px var(--wh)}
.node.done{background:var(--wh);color:#081020;border-color:var(--wh)}
.node.boss{width:42px;height:42px}
.link{flex:1;height:2px;background:var(--line)} .link.done{background:var(--wh)}
/* Layers */
.layer{position:relative;background:var(--void);display:flex;flex-direction:column}
.layer .inner{width:100%;box-sizing:border-box;max-width:560px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
/* Dialogue */
.dlg{justify-content:flex-end;min-height:560px;cursor:pointer;background:radial-gradient(ellipse at 50% 30%,#1b2156,var(--void) 70%)}
.dlg .scene{flex:1;display:grid;place-items:center;padding-block:40px}
.speaker-gem{width:120px;height:120px;transform:rotate(45deg);border-radius:14px;display:grid;place-items:center;border:2px solid var(--sc);box-shadow:0 0 40px -6px var(--sc)}
.speaker-gem span{transform:rotate(-45deg);font:40px var(--display);color:var(--sc)}
.speaker-gem.lumeria{background:var(--prism);border-color:transparent}
.speaker-gem.lumeria span{color:#0a0c19}
.dbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:130px;max-width:560px;width:calc(100% - 32px);margin:0 auto 16px}
.dbox .nm{font:16px var(--display);letter-spacing:.06em;color:var(--sc);margin-bottom:6px}
.dbox p{margin:0;font-size:17px;line-height:1.5}
.dbox .narr{font-style:italic;color:#c8cdf0}
.dbox .hint{margin-top:10px;font-size:12px;color:var(--muted);text-align:right}
/* Creation */
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--facet);box-shadow:0 0 0 2px var(--void),0 0 0 4px var(--facet)}
.opt{border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;background:#0d1028}
.opt.on{border-color:var(--facet);background:#102040}
.opt b{display:block}
.opt>span{display:block}
input[type=text],input[type=password]{width:100%;box-sizing:border-box;background:#0d1028;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);font:16px var(--body)}
.avatar-wrap{display:grid;place-items:center;background:radial-gradient(circle,#1e2559,transparent 70%);border-radius:12px;padding:6px}
/* Battle */
.foes{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.foe{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:5px;align-items:center}
.foe.tgt{border-color:var(--rot);box-shadow:0 0 0 1px var(--rot)}
.foe.dead{opacity:.25}
.foe .nm{font-size:13px;font-weight:600;line-height:1.15}
.foe.boss{grid-column:1/-1}
.tier{font-weight:700;letter-spacing:.02em} .tier.t2{color:#ffb347} .tier.t3{color:#7ef2ff} .tier.t4{color:#ffd166;text-shadow:0 0 8px #ffd16688}
.foe.ft2{border-color:#ffb34788} .foe.ft3{border-color:#7ef2ffaa;box-shadow:0 0 14px #7ef2ff33} .foe.ft4{grid-column:1/-1;border-color:#ffd166;box-shadow:0 0 18px #ffd16655}
.foe .bar{width:100%}
.log{background:#0d1028;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;min-height:86px}
.log .you{color:var(--facet)} .log .foe-l{color:#ffb3c4} .log .warn{color:var(--gold);font-weight:700} .log .sys{color:var(--muted)}
.hero-panel{display:flex;gap:12px;align-items:center}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;min-height:54px;justify-content:center}
.act b{font-size:13.5px;line-height:1.15}
.act small{font-size:11.5px;color:var(--muted)}
.act.cls-main{border-color:var(--cc)}
.act:disabled{opacity:.38}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:700;font-size:20px;pointer-events:none;animation:up .9s ease-out forwards;text-shadow:0 2px 4px #000}
.float.crit{color:var(--gold);font-size:26px} .float.heal{color:var(--ok)} .float.dot{color:#c08bff;font-size:16px}
@keyframes up{to{transform:translate(-50%,-34px);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* Sheet & toast */
.sheet-bg{display:flex;justify-content:center;padding-block:12px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;box-sizing:border-box;
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--facet);border-radius:8px;padding:9px 14px;font-weight:600;max-width:calc(100% - 48px);text-align:center}
.item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;background:#0d1028;text-align:left;width:100%;box-sizing:border-box}
.item .rar{width:10px;align-self:stretch;border-radius:3px;background:var(--rc);flex:none}
.item b{display:block;color:var(--rc)}
.pips{display:inline-flex;gap:3px} .pips i{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--facet)} .pips i.on{background:var(--facet)}
.lux{border-color:#5a4a1a;background:linear-gradient(160deg,#1d1a10,#131733 60%)}
.sealed{filter:saturate(.2)}
.title-prism{background:var(--prism);-webkit-background-clip:text;background-clip:text;color:transparent}
/* Open world (World tab): the scene fills the screen and the HUD (character, log, controls) sits on top of it.
   On an upright phone the whole frame is turned 90° so the world is always wide; see layoutStage() in realm.js. */
#app.world{max-width:none}
#app.world #topbar,#app.world #tabs{display:none}
#app.world #screen{padding:0;gap:0}
.rw-stage{position:relative;width:100%;height:100vh;overflow:hidden;background:#05060d}
.rw-frame{position:absolute;left:0;top:0;width:100%;height:100%}
.rw-scene{position:absolute;inset:0;overflow:hidden}
.rw-canvas-wrap{position:absolute;inset:0}
.rw-canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.rw-canvas:active{cursor:grabbing}
.rw-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rw-label{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px;background:#0a0c19cc;border:1px solid var(--line);color:var(--text)}
.rw-nogl{padding:20px;color:var(--muted)}
.rw-mini{position:absolute;right:12px;top:12px;width:104px;height:104px;border-radius:50%;background:#0a0c19aa;border:1px solid #ffffff2a;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 18px #0008}
.hud{position:absolute;inset:0;pointer-events:none;-webkit-user-select:none;user-select:none}
.hud>*{pointer-events:auto}
.hud-glass{background:#0a0c19b3;border:1px solid #ffffff1f;border-radius:12px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 18px #0006}
.hud-tl{position:absolute;left:12px;top:12px;width:min(270px,38%);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hud-tl>*{pointer-events:auto}
.hud-char{padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.rw-name{font:15px var(--display);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-name .pts{color:var(--gold);font:600 11px var(--body)}
.hud-bar{position:relative;height:15px;border-radius:8px;background:#ffffff14;overflow:hidden;margin-top:3px}
.hud-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .3s}
.hud-bar.hp i{background:linear-gradient(90deg,#d8344f,#ff6b81)} .hud-bar.mp i{background:linear-gradient(90deg,#2f5fd8,#6fa8ff)}
.hud-bar span{position:relative;display:block;font-size:10px;font-weight:700;padding-left:7px;line-height:15px;letter-spacing:.05em;text-shadow:0 1px 2px #000}
.hud-bar.xp{height:4px;margin-top:4px} .hud-bar.xp i{background:var(--gold)}
.hud-char .chip{font-size:10px;padding:2px 8px;align-self:flex-start;white-space:nowrap;margin-top:2px}
.rw-party{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:#c9cde8}
.hud-realm{position:absolute;left:calc(var(--fw,100vw) / 2 - 12px);top:0;transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 1px 4px #000;width:max-content;max-width:calc(var(--fw,100vw) * .32)}
.hud-realm b{font:18px var(--display);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.hud-realm .eyebrow{color:#c9cde8}
.rw-region{color:var(--facet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.narrow .hud-realm{position:static;transform:none;text-align:left;max-width:none;background:#0a0c1980;border-radius:10px;padding:5px 10px}
.narrow .hud-realm b{font-size:14px} .narrow .hud-realm .eyebrow{font-size:9px}
.hud-top-btns{position:absolute;right:128px;top:12px;display:flex;gap:6px}
.hud-btn{width:48px;height:48px;border-radius:12px;background:#0a0c19b3;border:1px solid #ffffff1f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;line-height:1;box-shadow:0 4px 14px #0006}
.hud-btn small{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#c9cde8;margin-top:4px}
.hud-btn.on{border-color:var(--facet);color:var(--facet)}
.hud-log{position:absolute;left:150px;right:250px;bottom:12px;max-width:480px;margin:0 auto;display:flex;flex-direction:column;max-height:32%;min-height:0}
.hud-log-head{display:flex;gap:8px;align-items:center;padding:6px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#c9cde8}
.hud-log-head span:first-child{margin-right:auto} .hud-log-head::after{content:'▾'} .hud-log.min .hud-log-head::after{content:'▴'}
.hud-log .log{overflow-y:auto;padding:0 10px 8px;font-size:12px;line-height:1.35;min-height:0;flex:1;scroll-behavior:smooth;background:none;border:0}
.hud-log.min .log{display:none}
.rw-joy{position:absolute;left:22px;bottom:22px;width:116px;height:116px;border-radius:50%;background:#0a0c1980;border:1px solid #ffffff2a;touch-action:none;box-shadow:inset 0 0 24px #0008}
.rw-joy i{width:50px;height:50px;border-radius:50%;background:#1a1f45e6;border:2px solid var(--facet);position:absolute;left:calc(50% - 25px);top:calc(50% - 25px);box-shadow:0 0 14px #7ef2ff55}
.hud-acts{position:absolute;right:16px;bottom:16px;width:236px;height:180px;pointer-events:none}
.hud-acts>*{pointer-events:auto;position:absolute}
.hud-acts .act{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;background:#131733d9;border:2px solid #ffffff2a;box-shadow:0 6px 18px #0008}
.hud-acts .act b{font-size:14px}
.hud-acts .act small{font-size:9px;line-height:1.15;color:#c9cde8;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hud-attack{right:0;bottom:0;width:118px;height:118px}
.hud-interact{right:126px;bottom:0;width:96px;height:96px}
.rw-btn.ready{border-color:var(--facet)!important;box-shadow:0 0 0 2px var(--facet),0 6px 18px #0008!important}
#rwAttack.ready{border-color:var(--rot)!important;box-shadow:0 0 0 2px var(--rot),0 0 20px #ff4d7a66!important}
.hud-pot{width:50px;height:50px;border-radius:50%;background:#131733d9;border:1px solid #ffffff2a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;line-height:1;box-shadow:0 4px 14px #0008}
.hud-pot small{font-size:10px;font-weight:700;margin-top:2px}
.hud-pot.hp{right:126px;bottom:108px;color:#ff8a9c} .hud-pot.mp{right:66px;bottom:128px;color:#8ab8ff}
.hud-pot:disabled{opacity:.45}
.hud-keys{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);color:#ffffff80;pointer-events:none;white-space:nowrap;font-size:11px;text-shadow:0 1px 2px #000}
.touch .hud-keys,.narrow .hud-keys{display:none}
.rw-frame:not(.touch):not(.narrow) .hud-log{bottom:28px}
.hud-bag{position:absolute;right:12px;top:72px;width:min(330px,44%);max-height:calc(100% - 84px);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
.rw-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rw-stats>div{display:flex;flex-direction:column;min-width:0}
.rw-stats span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-stats b{font-size:15px} .rw-stats small{font-size:11px;color:var(--muted)}
.rw-inv{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.rw-quest{font-size:12px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
/* short screens (phones held sideways) */
.compact .hud-char{padding:6px 8px} .compact .rw-name{font-size:13px} .compact .hud-bar{height:13px} .compact .hud-bar span{line-height:13px}
.compact .rw-mini{width:84px;height:84px;top:8px;right:8px}
.compact .hud-tl{top:8px;left:8px;width:min(230px,34%)}
.compact .hud-top-btns{right:100px;top:8px} .compact .hud-btn{width:42px;height:42px}
.compact .rw-joy{left:14px;bottom:14px;width:100px;height:100px} .compact .rw-joy i{width:44px;height:44px;left:calc(50% - 22px);top:calc(50% - 22px)}
.compact .hud-acts{right:10px;bottom:10px;transform:scale(.86);transform-origin:bottom right}
.compact .hud-log{left:128px;right:214px;bottom:8px;max-height:30%}
.compact .hud-bag{top:58px;max-height:calc(100% - 66px)}
.compact .rw-party{display:none}
/* Party, battle party rows, daily, story arcs, map */
.party{display:flex;flex-direction:column;gap:8px}
.unit{position:relative;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.unit svg{width:34px;height:auto}
.unit.down{opacity:.4}
.blog{max-height:132px;overflow-y:auto;min-height:0}
.pslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pslot{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 6px;min-width:0}
.pslot b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pslot.empty{border-style:dashed;justify-content:center;min-height:80px}
.pslot.hero{border-color:var(--facet)}
.pq{width:40px;height:40px;display:grid;place-items:center;font:20px var(--display);color:var(--muted);border:1px dashed var(--line);transform:rotate(45deg);border-radius:6px}
details summary{cursor:pointer}
details p{margin:6px 0 0}
.daily-btn{flex:none}
.ldays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.lday{background:#0d1028;border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.lday b{font-size:11px} .lday small{font-size:9px;color:var(--gold)} .lday .eyebrow{font-size:9px;letter-spacing:.04em}
.lday.got{opacity:.45} .lday.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.arc-head{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.arc-head b{font:17px var(--display)} .arc-head.on{border-color:var(--facet)} .arc-head:disabled{opacity:.45}
.rw-bigmap{width:100%;aspect-ratio:1;max-width:520px;align-self:center;background:#0a0c19;border-radius:12px;border:1px solid var(--line)}
.map-key{display:flex;flex-wrap:wrap;gap:10px}
.map-key i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:middle}
.k-mark{background:#ffc145;transform:rotate(45deg)} .k-shrine{background:#fff;transform:rotate(45deg)} .k-chest{background:#ffc145} .k-npc{background:#7ef2ff;border-radius:50%}
/* Phones held upright: the whole game is turned sideways so it always plays in landscape (see orient() in art.js). */
html.rot,html.rot body{height:100%;overflow:hidden}
html.rot #root{position:fixed;left:0;top:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--void);background-image:radial-gradient(ellipse at 50% -10%,#1d2252 0,transparent 60%)}
.land #app:not(.world){max-width:none;display:grid;grid-template-columns:78px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:var(--vh)}
.land #app:not(.world) .topbar{grid-column:2;padding-block:6px}
.land #app:not(.world) #screen{grid-column:2;padding-block:10px 16px;max-width:900px;width:100%;box-sizing:border-box;margin:0 auto}
.land #app:not(.world) .tabs{grid-column:1;grid-row:1/3;position:sticky;top:0;bottom:auto;height:var(--vh);grid-template-columns:1fr;grid-auto-rows:1fr;border-top:0;border-right:1px solid var(--line);padding:0}
.land .tabs button{padding:0;gap:3px;justify-content:center;font-size:9px}
.land .sheet{max-width:820px}
.land .layer .inner{max-width:1100px;padding-block:10px}
.land .layer .inner.battle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:14px;row-gap:8px;align-items:start}
.land .inner.battle>.row{grid-column:1/-1}
.land .inner.battle>.foes{grid-column:1;grid-row:2}
.land .inner.battle>.blog{grid-column:1;grid-row:3;max-height:110px}
.land .inner.battle>.party{grid-column:2;grid-row:2}
.land .inner.battle>:last-child{grid-column:2;grid-row:3}
.land .inner.battle .foe{padding:5px;gap:3px}
.land .inner.battle .unit{padding:4px 8px}
.land .inner.battle .actions{grid-template-columns:repeat(3,1fr);gap:6px}
.land .inner.battle .act{min-height:44px;padding:6px 4px}
.map-cols{display:flex;flex-direction:column;gap:10px}
.land .map-cols{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.land .rw-bigmap{width:calc(var(--vh) - 150px);max-width:none;align-self:start;position:sticky;top:8px}
.land .inner.creator{display:grid;grid-template-columns:240px minmax(0,1fr);column-gap:20px;row-gap:12px}
.land .inner.creator>*{grid-column:2}
.land .inner.creator>#cprev{grid-column:1;grid-row:1/span 40;position:sticky;top:10px;align-self:start}
.acct-float{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:55}
.acct-btn.on{border-color:var(--facet);color:var(--facet)}
.rw-label.foe{background:#2a0f1ccc;border-color:#ff4d7a66;font-size:11px} .rw-label.foe.t2{color:#ffcf8a;border-color:#ffb34799} .rw-label.foe.t3{color:#bff6ff;border-color:#7ef2ffaa} .rw-label.foe.t4{color:#ffe7a3;border-color:#ffd166;box-shadow:0 0 10px #ffd16666}
.rw-label.foe.danger::after{content:' ⚠';color:#ff6b81}
.k-way{background:#7ef2ff;border-radius:50%;border:1px solid #0a0c19} .ft-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px} .ft-list .opt{text-align:left} 
.k-gate{border:2px solid #b07cff} .k-town{border:2px solid var(--facet);border-radius:50%} .k-foe{background:#ff4d7a;border-radius:50%}
.rw-label.mark{color:var(--gold);border-color:#5a4a1a}
.log .ally{color:#a6f0c6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
