<title>Diamondverse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen mobile app — top status bar, scrolling screen, bottom tab bar; battle/dialogue/creation are full-screen layers. */
:root{
  --void:#0a0c19; --panel:#131733; --panel2:#1a1f44; --line:#2a3166; --text:#e9ecff; --muted:#8e95c6;
  --facet:#7ef2ff; --gold:#ffc145; --rot:#ff4d7a; --hp:#ff5d73; --mp:#5fb3ff; --ok:#6fe3a1;
  --display:'Marcellus SC', 'Cinzel', Georgia, serif;
  --body:'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --prism:linear-gradient(120deg,#7ef2ff,#b07cff 45%,#ffc145 80%,#7ef2ff);
  color-scheme:dark;
}
[hidden]{display:none!important}
body{background:var(--void);color:var(--text);font:15px/1.4 var(--body);
  background-image:radial-gradient(ellipse at 50% -10%,#1d2252 0,transparent 60%);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--void)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--facet);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#app.wide{max-width:1180px}
.topbar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.topbar .who{flex:1;min-width:0}
.topbar .who b{font:17px var(--display);letter-spacing:.04em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .who small{color:var(--muted)}
.cur{display:flex;align-items:center;gap:5px;font-weight:600;font-size:14px}
.gem{width:12px;height:12px;transform:rotate(45deg);border-radius:2px;flex:none}
.gem.g{background:var(--gold)} .gem.d{background:var(--prism)} .gem.s{background:#b07cff}
#screen{padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{padding:10px 0 9px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px}
.tabs button i{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid currentColor}
.tabs button.on{color:var(--facet)} .tabs button.on i{background:var(--facet)}
h2{font:22px/1.15 var(--display);margin:0;letter-spacing:.03em;text-wrap:balance}
h3{font:15px var(--display);margin:0;letter-spacing:.06em;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--facet);color:#071022;border-color:transparent}
.btn.gold{background:var(--gold);color:#1d1400;border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}
.bar{height:8px;background:#0d1028;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--facet);transition:width .35s}
.bar.hp>i{background:var(--hp)} .bar.mp>i{background:var(--mp)} .bar.xp>i{background:var(--prism)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#0d1028}
.chip.rot{color:var(--rot);border-color:#5a2140} .chip.pure{color:var(--ok);border-color:#1f5a40} .chip.lock{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.stat{background:#0d1028;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat small{display:block;font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.stat b{font-size:18px}
/* Story map */
.world{position:relative;overflow:hidden}
.world::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,var(--wh) 0,transparent 55%);opacity:.18;pointer-events:none}
.nodes{display:flex;align-items:center;gap:0;margin-top:12px}
.node{width:34px;height:34px;transform:rotate(45deg);border:2px solid var(--line);background:#0d1028;border-radius:5px;display:grid;place-items:center;flex:none}
.node span{transform:rotate(-45deg);font-weight:700;font-size:13px}
.node.open{border-color:var(--wh);box-shadow:0 0 12px -2px var(--wh)}
.node.done{background:var(--wh);color:#081020;border-color:var(--wh)}
.node.boss{width:42px;height:42px}
.link{flex:1;height:2px;background:var(--line)} .link.done{background:var(--wh)}
/* Layers */
.layer{position:relative;background:var(--void);display:flex;flex-direction:column}
.layer .inner{width:100%;box-sizing:border-box;max-width:560px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
/* Dialogue */
.dlg{justify-content:flex-end;min-height:560px;cursor:pointer;background:radial-gradient(ellipse at 50% 30%,#1b2156,var(--void) 70%)}
.dlg .scene{flex:1;display:grid;place-items:center;padding-block:40px}
.speaker-gem{width:120px;height:120px;transform:rotate(45deg);border-radius:14px;display:grid;place-items:center;border:2px solid var(--sc);box-shadow:0 0 40px -6px var(--sc)}
.speaker-gem span{transform:rotate(-45deg);font:40px var(--display);color:var(--sc)}
.speaker-gem.lumeria{background:var(--prism);border-color:transparent}
.speaker-gem.lumeria span{color:#0a0c19}
.dbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:130px;max-width:560px;width:calc(100% - 32px);margin:0 auto 16px}
.dbox .nm{font:16px var(--display);letter-spacing:.06em;color:var(--sc);margin-bottom:6px}
.dbox p{margin:0;font-size:17px;line-height:1.5}
.dbox .narr{font-style:italic;color:#c8cdf0}
.dbox .hint{margin-top:10px;font-size:12px;color:var(--muted);text-align:right}
/* Creation */
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--facet);box-shadow:0 0 0 2px var(--void),0 0 0 4px var(--facet)}
.opt{border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;background:#0d1028}
.opt.on{border-color:var(--facet);background:#102040}
.opt b{display:block}
.opt>span{display:block}
input[type=text]{width:100%;box-sizing:border-box;background:#0d1028;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);font:16px var(--body)}
.avatar-wrap{display:grid;place-items:center;background:radial-gradient(circle,#1e2559,transparent 70%);border-radius:12px;padding:6px}
/* Battle */
.foes{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.foe{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:5px;align-items:center}
.foe.tgt{border-color:var(--rot);box-shadow:0 0 0 1px var(--rot)}
.foe.dead{opacity:.25}
.foe .nm{font-size:13px;font-weight:600;line-height:1.15}
.foe.boss{grid-column:1/-1}
.foe .bar{width:100%}
.log{background:#0d1028;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;min-height:86px}
.log .you{color:var(--facet)} .log .foe-l{color:#ffb3c4} .log .warn{color:var(--gold);font-weight:700} .log .sys{color:var(--muted)}
.hero-panel{display:flex;gap:12px;align-items:center}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;min-height:54px;justify-content:center}
.act b{font-size:13.5px;line-height:1.15}
.act small{font-size:11.5px;color:var(--muted)}
.act.cls-main{border-color:var(--cc)}
.act:disabled{opacity:.38}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:700;font-size:20px;pointer-events:none;animation:up .9s ease-out forwards;text-shadow:0 2px 4px #000}
.float.crit{color:var(--gold);font-size:26px} .float.heal{color:var(--ok)} .float.dot{color:#c08bff;font-size:16px}
@keyframes up{to{transform:translate(-50%,-34px);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* Sheet & toast */
.sheet-bg{display:flex;justify-content:center;padding-block:12px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;box-sizing:border-box;
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--facet);border-radius:8px;padding:9px 14px;font-weight:600;max-width:calc(100% - 48px);text-align:center}
.item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;background:#0d1028;text-align:left;width:100%;box-sizing:border-box}
.item .rar{width:10px;align-self:stretch;border-radius:3px;background:var(--rc);flex:none}
.item b{display:block;color:var(--rc)}
.pips{display:inline-flex;gap:3px} .pips i{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--facet)} .pips i.on{background:var(--facet)}
.lux{border-color:#5a4a1a;background:linear-gradient(160deg,#1d1a10,#131733 60%)}
.sealed{filter:saturate(.2)}
.title-prism{background:var(--prism);-webkit-background-clip:text;background-clip:text;color:transparent}
/* Open world (World tab) — wireframe: title / [character | scene] / [inventory | action log] / controls.
   Phone: title, character, scene, controls, log, inventory, so the scene and controls share one screen. */
.rw{display:grid;gap:10px;grid-template-columns:1fr;grid-template-areas:"head" "char" "scene" "ctrl" "log" "inv"}
.rw-head{grid-area:head;display:flex;align-items:flex-end;gap:10px;padding-bottom:6px;border-bottom:2px solid var(--wh)}
.rw-char{grid-area:char} .rw-scene{grid-area:scene} .rw-log{grid-area:log} .rw-inv{grid-area:inv} .rw-ctrl{grid-area:ctrl}
.rw-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rw-name{font:17px var(--display);letter-spacing:.03em}
.rw-stat{display:flex;justify-content:space-between;gap:8px;font-size:14px} .rw-stat span{color:var(--muted)}
.rw-bars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rw-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:2px}
.rw-stats>div{display:flex;flex-direction:column;min-width:0}
.rw-stats span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-stats b{font-size:15px} .rw-stats small{font-size:11px;color:var(--muted)}
.rw-head h2{font-size:20px}
.rw-stats i{font-style:normal} .rw-stats .lg{display:none}
.rw-head .small{display:none}
.rw-char{padding:10px 12px;gap:4px}
.rw-scene{padding:0;overflow:hidden;position:relative;height:280px}
.rw-canvas-wrap{position:absolute;inset:0}
.rw-canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.rw-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rw-label{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px;background:#0a0c19cc;border:1px solid var(--line);color:var(--text)}
.rw-nogl{padding:20px;color:var(--muted)}
.rw-log .log{min-height:0}
.rw-inv ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.rw-ctrl-row{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;align-items:center}
.rw-joy{width:96px;height:96px;border-radius:50%;background:#0d1028;border:1px solid var(--line);position:relative;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.rw-joy i{width:44px;height:44px;border-radius:50%;background:var(--panel2);border:2px solid var(--facet);position:absolute;left:calc(50% - 22px);top:calc(50% - 22px)}
.rw-joy span{position:absolute;bottom:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.rw-btn{min-height:64px}
.rw-btn.ready{border-color:var(--facet);box-shadow:0 0 0 1px var(--facet)}
#rwAttack.ready{border-color:var(--rot);box-shadow:0 0 0 1px var(--rot)}
@media (min-width:760px){
  .rw-stats .lg{display:inline} .rw-stats .sm{display:none} .rw-head .small{display:block}
  .rw-stats{grid-template-columns:1fr 1fr;row-gap:10px}
  .rw-bars{grid-template-columns:1fr}
  .rw{grid-template-columns:300px 1fr;grid-template-areas:"head head" "char scene" "inv log" "ctrl ctrl"}
  .rw-scene{height:auto;min-height:420px}
  .rw-ctrl-row{grid-template-columns:auto 200px 200px;justify-content:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="screen"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="layer"></div>
<div id="sheet"></div>
<div id="toast" hidden></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="payments.js"></script>
<script src="art.js"></script>
<script src="gfx.js"></script>
<script src="views.js"></script>
<script src="screens.js"></script>
<script src="realm.js"></script>
<script src="battle.js"></script>
